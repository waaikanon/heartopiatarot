<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartopia Tarot - Premium Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ================== VARIABLES & RESET ================== */
        :root {
            --bg-top: #1a1b41;
            --bg-mid: #151630;
            --bg-bottom: #0d0e1f;
            --primary: #00f2fe;    
            --secondary: #4facfe;  
            --accent: #f9d423;     
            --text-light: #f8f9fa;
            --text-muted: #aab5c9;
            --btn-top: #748bc8;
            --btn-bottom: #4d5d91;
            
            /* Responsive Card Sizes */
            --slot-w: 140px;
            --slot-h: 240px;
            --img-w: 125px;
            --img-h: 185px;
            --gap-main: 30px;
            --gap-sm: 15px;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Prompt', sans-serif; margin: 0; padding: 20px; min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
            color: var(--text-light); text-align: center;
            overflow-x: hidden; position: relative;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ================== MAGICAL SCENERY ================== */
        .star {
            position: fixed; background: #fff; border-radius: 50%; z-index: -3;
            animation: twinkle linear infinite; box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .curtain {
            position: fixed; top: -10%; width: 25vw; min-width: 150px; height: 120vh;
            background: linear-gradient(90deg, #5b5ca8 0%, #3e3d82 100%);
            border-radius: 50%; z-index: -2; opacity: 0.9;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.4);
        }
        .curtain.left { left: -12vw; transform: rotate(-8deg); border-right: 2px solid rgba(255,255,255,0.15); }
        .curtain.right { right: -12vw; transform: rotate(8deg); border-left: 2px solid rgba(255,255,255,0.15); }

        .hanging-decor { position: fixed; top: 0; display: flex; flex-direction: column; align-items: center; z-index: -1; }
        .hanging-decor.d1 { left: 18%; }
        .hanging-decor.d2 { right: 18%; }
        .hanging-decor.d3 { left: 35%; top: -20px; transform: scale(0.7); opacity: 0.6;}
        .hanging-decor.d4 { right: 35%; top: -10px; transform: scale(0.8); opacity: 0.7;}
        .decor-line { width: 1.5px; height: 120px; background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent); }
        .hanging-decor.d3 .decor-line, .hanging-decor.d4 .decor-line { height: 70px; }
        .decor-star { 
            width: 28px; height: 28px; background: #e0f2fe; 
            clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%); 
            transform: translateY(-14px); box-shadow: 0 0 20px rgba(255,255,255,0.9);
            animation: pulseStar 3s infinite alternate;
        }
        @keyframes pulseStar { 0% { filter: drop-shadow(0 0 5px #fff) brightness(1); } 100% { filter: drop-shadow(0 0 15px #00f2fe) brightness(1.3); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

        /* ================== TYPOGRAPHY & LAYOUT ================== */
        h1 { 
            color: transparent; margin-bottom: 5px; font-weight: 600; letter-spacing: 1.5px;
            background: linear-gradient(to right, #ffffff, #cce3ff);
            -webkit-background-clip: text; background-clip: text;
            text-shadow: 0 0 15px rgba(255,255,255,0.3); position: relative; z-index: 10;
        }
        
        .phase { display: none; opacity: 0; transition: opacity 0.5s ease; width: 100%; max-width: 1000px; position: relative; z-index: 10; }
        .active { display: block; animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInScale { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ================== GLASS PANELS ================== */
        .glass-panel {
            background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; 
            padding: 40px; margin: 20px auto; width: 100%;
        }
        .panel-title { color: var(--accent); font-weight: 500; font-size: 22px; margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);}

        /* ================== QUESTION GRID (Phase 1) ================== */
        .question-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 18px; 
            max-height: 65vh; overflow-y: auto; padding-right: 15px; padding-bottom: 20px;
        }
        .q-item { 
            background: linear-gradient(180deg, var(--btn-top) 0%, var(--btn-bottom) 100%); 
            border: 2px solid rgba(255, 255, 255, 0.3); padding: 16px 25px; border-radius: 40px; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 15px; display: flex; align-items: center; justify-content: center; 
            color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .q-item:hover { 
            border-color: #fff; transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 8px 20px rgba(77, 93, 145, 0.6); filter: brightness(1.1);
        }

        /* ================== SPREAD SELECTOR (Phase 2) ================== */
        .spread-selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .spread-card-menu { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px 15px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 200px; }
        .spread-card-menu:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--secondary); transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .spread-card-menu:hover .mini-card { border-color: var(--primary); color: var(--primary);}
        .spread-card-visual { min-height: 120px; display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 10px; }
        .spread-card-title { font-size: 16px; color: var(--text-light); font-weight: 500; }
        .spread-card-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 5px; }

        .mini-card { width: 26px; height: 38px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.4); font-size: 11px; font-weight: 600; color: #fff; transition: 0.3s; }
        
        .mini-spark { display: flex; justify-content: center; }
        .mini-time { display: flex; gap: 8px; justify-content: center; }
        .mini-insight { display: grid; grid-template-columns: repeat(3, auto); gap: 10px; align-items: center; justify-content: center;}
        .mini-insight .c1 { transform: translateY(-12px); }
        .mini-insight .c2 { transform: translateY(12px); }
        .mini-insight .c3 { transform: translateY(-12px); }
        .mini-jigsaw { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; justify-items: center; align-items: center; justify-content: center;}
        .mini-jigsaw .c4 { grid-column: 2; grid-row: 1; transform: translateY(5px); }
        .mini-jigsaw .c1 { grid-column: 1; grid-row: 2; }
        .mini-jigsaw .c2 { grid-column: 2; grid-row: 2; }
        .mini-jigsaw .c3 { grid-column: 3; grid-row: 2; }
        .mini-crossroad { display: grid; grid-template-columns: repeat(5, auto); gap: 5px; align-items: center; justify-content: center;}
        .mini-crossroad .c4 { transform: translateY(-18px); }
        .mini-crossroad .c2 { transform: translateY(0px); }
        .mini-crossroad .c1 { transform: translateY(18px); }
        .mini-crossroad .c3 { transform: translateY(0px); }
        .mini-crossroad .c5 { transform: translateY(-18px); }
        .mini-relation { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 12px; justify-content: center;}

        /* ================== BUTTONS & TOGGLES ================== */
        .btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 12px 28px; border-radius: 30px; cursor: pointer; margin: 8px; font-size: 15px; font-family: 'Prompt', sans-serif; transition: all 0.3s ease; backdrop-filter: blur(5px);}
        .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); border-color: #fff;}
        .btn-success { background: linear-gradient(135deg, var(--accent), #ff9a44); color: #000; font-size: 18px; padding: 16px 45px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(249, 212, 35, 0.4); border: none;}
        .btn-success:hover { box-shadow: 0 8px 25px rgba(249, 212, 35, 0.6); border: none;}

        .toggle-container { display: inline-flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); padding: 12px 25px; border-radius: 30px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .switch { position: relative; display: inline-block; width: 54px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* ================== TOP CONTROL PANEL ================== */
        .top-controls { position: absolute; top: 25px; right: 25px; display: flex; gap: 12px; z-index: 100; align-items: center; }
        .control-btn { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-family: 'Prompt'; font-size: 13px; display: flex; align-items: center; justify-content: center; }
        .control-btn.active-lang { background: rgba(255,255,255,0.1); border-color: var(--primary); color: var(--primary); font-weight: 500; box-shadow: inset 0 0 10px rgba(0,242,254,0.2); }

        /* ================== CARD SLOTS (Visuals Phase 3) ================== */
        .reading-area { position: relative; width: 100%; margin: 40px auto; min-height: 450px; display: flex; justify-content: center; align-items: center; }
        .card-slot { width: var(--slot-w); height: var(--slot-h); background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: inset 0 0 20px rgba(0,0,0,0.5); margin: 0 auto; }
        .card-slot:hover { border-color: var(--primary); background: rgba(0,242,254,0.05); transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(0,242,254,0.2); }
        .card-slot.has-card { border-style: solid; border-color: rgba(255,255,255,0.2); background: transparent; box-shadow: none; }
        .card-slot.has-card:hover { border-color: var(--accent); }
        .card-image-preview { width: var(--img-w); height: var(--img-h); object-fit: contain; border-radius: 10px; margin-bottom: 5px; display: none; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card-slot.is-reversed .card-image-preview { transform: rotate(180deg); }
        .card-label { font-size: 12px; color: var(--text-muted); pointer-events: none; line-height: 1.4; padding: 0 5px; transition: 0.3s; }
        .card-slot.has-card .card-label { color: var(--text-light); }
        .card-badge { position: absolute; top: -12px; left: -12px; background: var(--bg-top); border: 2px solid var(--primary); color: var(--primary); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 3;}
        .card-status-btn { background: rgba(0,0,0,0.8); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.2); font-size: 11px; padding: 6px 14px; border-radius: 15px; margin-top: 8px; display: none; z-index: 2; backdrop-filter: blur(5px); transition: 0.3s;}
        .card-status-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #fff; }
        .card-slot.is-reversed .card-status-btn { color: var(--accent); border-color: var(--accent); }

        /* FIXED GRID ALIGNMENT */
        .layout-spark { display: flex; justify-content: center; width: 100%;}
        .layout-time { display: flex; justify-content: center; gap: var(--gap-main); width: 100%;}
        .layout-insight { display: grid; grid-template-columns: repeat(3, auto); gap: var(--gap-main); justify-content: center; align-items: center; width: 100%;}
        .layout-insight #slot-0 { grid-column: 1; grid-row: 1; }
        .layout-insight #slot-1 { grid-column: 2; grid-row: 2; margin-top: 50px; }
        .layout-insight #slot-2 { grid-column: 3; grid-row: 1; }
        .layout-jigsaw { display: grid; grid-template-columns: repeat(3, auto); gap: var(--gap-sm); justify-content: center; align-items: center; width: 100%;}
        .layout-jigsaw #slot-3 { grid-column: 2; grid-row: 1; margin-bottom: 20px;}
        .layout-jigsaw #slot-0 { grid-column: 1; grid-row: 2; }
        .layout-jigsaw #slot-1 { grid-column: 2; grid-row: 2; }
        .layout-jigsaw #slot-2 { grid-column: 3; grid-row: 2; }
        .layout-crossroad { display: grid; grid-template-columns: repeat(5, auto); gap: var(--gap-sm); justify-content: center; align-items: center; width: 100%;}
        .layout-crossroad #slot-3 { grid-column: 1; grid-row: 1; }
        .layout-crossroad #slot-1 { grid-column: 2; grid-row: 2; margin-top: 40px;}
        .layout-crossroad #slot-0 { grid-column: 3; grid-row: 3; margin-top: 80px;}
        .layout-crossroad #slot-2 { grid-column: 4; grid-row: 2; margin-top: 40px;}
        .layout-crossroad #slot-4 { grid-column: 5; grid-row: 1; }
        .layout-relation { display: grid; grid-template-columns: repeat(3, auto); gap: var(--gap-main); justify-content: center; width: 100%;}
        .layout-relation #slot-0 { grid-column: 1; grid-row: 1; }
        .layout-relation #slot-2 { grid-column: 2; grid-row: 1; }
        .layout-relation #slot-4 { grid-column: 3; grid-row: 1; }
        .layout-relation #slot-1 { grid-column: 1; grid-row: 2; }
        .layout-relation #slot-3 { grid-column: 2; grid-row: 2; }
        .layout-relation #slot-5 { grid-column: 3; grid-row: 2; }

        /* ================== MODAL ================== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); z-index: 1000; overflow-y: auto; padding-top: 60px; }
        .modal-content { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding-bottom: 50px; }
        .modal-card { width: 100px; cursor: pointer; text-align: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: rgba(255,255,255,0.02); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .modal-card:hover { transform: scale(1.1) translateY(-10px); border-color: var(--primary); background: rgba(0,242,254,0.05); box-shadow: 0 15px 30px rgba(0,0,0,0.5);}
        .modal-card img { width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .modal-card span { display: block; font-size: 11px; margin-top: 10px; color: var(--text-muted); transition: 0.3s;}
        .modal-card:hover span { color: #fff; }
        .close-modal { position: fixed; top: 20px; right: 40px; font-size: 50px; color: rgba(255,255,255,0.5); cursor: pointer; z-index: 1001; transition: 0.3s; line-height: 1;}
        .close-modal:hover { color: var(--accent); transform: rotate(90deg); }

        /* ================== RESULTS ================== */
        .summary-dashboard { background: rgba(0,0,0,0.3); padding: 40px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 40px; box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.02), 0 10px 40px rgba(0,0,0,0.4); text-align: left; position: relative; overflow: hidden; width: 100%;}
        .summary-title { text-align: center; color: var(--accent); font-size: 28px; font-weight: 600; margin-bottom: 30px; letter-spacing: 1px; position: relative; z-index: 1;}
        .question-highlight { background: rgba(0,0,0,0.4); padding: 20px 25px; border-left: 4px solid var(--secondary); font-size: 18px; margin-bottom: 30px; border-radius: 0 12px 12px 0; color: #fff; position: relative; z-index: 1;}
        .summary-text { font-size: 16px; line-height: 1.8; margin-bottom: 20px; color: var(--text-light); position: relative; z-index: 1;}
        .overall-reading-box { background: rgba(255,255,255,0.03); padding: 25px 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; position: relative; z-index: 1;}
        .final-advice-box { background: linear-gradient(90deg, rgba(249, 212, 35, 0.1) 0%, transparent 100%); padding: 30px; border-radius: 16px; border-left: 4px solid var(--accent); margin-top: 30px; font-size: 18px; line-height: 1.7; position: relative; z-index: 1;}
        
        .reading-section { display: flex; gap: 30px; background: rgba(0,0,0,0.4); padding: 35px; margin-bottom: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); align-items: flex-start; text-align: left; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%;}
        .reading-section:hover { background: rgba(0,0,0,0.6); border-color: rgba(0, 242, 254, 0.3); transform: translateY(-3px); }
        .reading-img { width: 120px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .reading-img.reversed { transform: rotate(180deg); }
        .card-title { color: var(--primary); font-size: 22px; font-weight: 500; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; margin-bottom: 20px; }
        .card-keywords { color: var(--accent); font-size: 14px; margin-bottom: 20px; font-weight: 500; background: rgba(249, 212, 35, 0.1); display: inline-block; padding: 6px 16px; border-radius: 30px; letter-spacing: 0.5px;}
        .card-desc { line-height: 1.8; font-size: 15px; margin-bottom: 20px; color: #cbd5e1;}
        .card-advice { color: #f8f9fa; font-weight: 500; background: rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 12px; border-left: 3px solid var(--primary); font-size: 15px; line-height: 1.6;}

        /* ================== MOBILE RESPONSIVENESS ================== */
        @media (max-width: 768px) {
            :root {
                --slot-w: 64px; --slot-h: 110px;
                --img-w: 54px; --img-h: 80px;
                --gap-main: 10px; --gap-sm: 5px;
            }
            .curtain, .hanging-decor { display: none; }

            body { padding: 10px; align-items: stretch; } 
            h1 { font-size: 22px; margin-top: 40px; line-height: 1.3;}
            
            .top-controls { top: 15px; right: 15px; gap: 8px; }
            .control-btn { padding: 4px 10px; font-size: 11px; }

            .glass-panel { padding: 25px 15px; margin: 15px auto; border-radius: 18px; }
            .panel-title { font-size: 18px; margin-bottom: 20px; }
            
            .question-grid { grid-template-columns: 1fr; max-height: 65vh; }
            .q-item { padding: 12px 15px; font-size: 13px; border-radius: 30px; }

            .spread-selector-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
            .spread-card-menu { padding: 15px 10px; min-height: 150px; }
            .spread-card-title { font-size: 13px; }
            .spread-card-subtitle { font-size: 11px; }
            
            .toggle-container { padding: 8px 15px; border-radius: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
            .toggle-container span { font-size: 12px !important; }
            .switch { width: 44px; height: 24px; }
            .slider:before { height: 16px; width: 16px; left: 4px; bottom: 4px; }
            input:checked + .slider:before { transform: translateX(20px); }

            .btn { padding: 10px 20px; font-size: 13px; }
            .btn-success { font-size: 15px; padding: 12px 30px; }
            
            .card-label { font-size: 8px; line-height: 1.2; }
            .card-label b { font-size: 9px; }
            .card-badge { width: 20px; height: 20px; font-size: 10px; top: -6px; left: -6px; }
            .card-status-btn { font-size: 8px; padding: 3px 6px; margin-top: 4px; }

            .reading-area { min-height: 250px; margin: 20px auto; }
            .layout-insight #slot-1 { margin-top: 25px; }
            .layout-crossroad #slot-1, .layout-crossroad #slot-2 { margin-top: 20px; }
            .layout-crossroad #slot-0 { margin-top: 40px; }

            .summary-dashboard { padding: 25px 15px; border-radius: 16px; }
            .summary-title { font-size: 20px; margin-bottom: 20px; }
            .question-highlight { font-size: 14px; padding: 12px 15px; margin-bottom: 20px; }
            .summary-text { font-size: 14px; }
            .overall-reading-box { padding: 15px; }
            .final-advice-box { font-size: 15px; padding: 15px; }
            
            .reading-section { flex-direction: column; align-items: center; text-align: center; padding: 20px 15px; border-radius: 16px; }
            .card-title { font-size: 18px; }
            .card-keywords { font-size: 12px; }
            .card-desc, .card-advice { font-size: 14px; }
            .card-advice { border-left: none; border-top: 3px solid var(--primary); text-align: left; }
            
            .modal { padding-top: 30px; }
            .modal-content { gap: 8px; padding: 0 10px 50px 10px; justify-content: center; }
            .modal-card { width: 28%; max-width: 80px; padding: 5px; }

                th: { kw: "การเริ่มต้นใหม่, อิสระเสรี, ความไร้เดียงสา, การผจญภัย", gen: "ไพ่ใบนี้เป็นตัวแทนของการเริ่มต้นใหม่ที่เต็มไปด้วยอิสระ คุณกำลังอยู่ในจุดที่พร้อมจะกระโดดเข้าสู่ความท้าทายใหม่ๆ โดยไม่ต้องมีแผนการที่ตายตัว เป็นการก้าวออกจากเซฟโซน ปลดปล่อยตัวเองจากความกลัว และทำตามเสียงเรียกร้องของหัวใจ แม้คนอื่นอาจมองว่าเสี่ยง แต่นี่คือพลังงานที่จะพุ่งไปสู่ศักยภาพใหม่ๆ", adv: "เชื่อมั่นในสัญชาตญาณตัวเอง ปล่อยวางความกังวลถึงอนาคตที่ยังมาไม่ถึง และอนุญาตให้ตัวเองได้ลองผิดลองถูกดูบ้าง ความสำเร็จซ่อนอยู่นอกกรอบเสมอ", r_kw: "ความประมาท, ขาดการไตร่ตรอง, ความเสี่ยงที่ควบคุมไม่ได้", r_gen: "คุณอาจกำลังทำอะไรที่เสี่ยงเกินไป กระโดดลงไปในสถานการณ์โดยไม่ได้มองให้รอบคอบ หรือกำลังวิ่งหนีปัญหาด้วยการทำตามอำเภอใจมากเกินไป", r_adv: "ชะลอความเร็วลงสักนิด ประเมินความเสี่ยงให้ดี อย่าปล่อยให้ความใจร้อนพาคุณไปสู่ปัญหาที่แก้ได้ยาก" },
                en: { kw: "New Beginnings, Freedom, Innocence, Adventure", gen: "This card represents a fresh start full of absolute freedom. You are ready to leap into new challenges without a rigid plan. It's time to step out of your comfort zone, release your fears, and follow your heart. Though others may see it as risky, this energy propels you toward undiscovered potential.", adv: "Trust your instincts. Let go of worries about the unwritten future, and allow yourself to experiment. Success lies outside the box.", r_kw: "Recklessness, Poor Judgment, Uncalculated Risks", r_gen: "You might be taking unnecessary risks, jumping into a situation blindly, or running away from problems by acting purely on impulse.", r_adv: "Slow down. Evaluate the risks carefully. Don't let impatience lead you into a situation that's hard to escape." }

            "The Magician": { type: "major",
                th: { kw: "ศักยภาพ, การเนรมิต, ความเชี่ยวชาญ, พลังสร้างสรรค์", gen: "คุณมีทรัพยากร ความรู้ และคอนเนคชันพร้อมทุกอย่างอยู่ในมือ เปรียบเสมือนนักเวทย์ที่สามารถเนรมิตสิ่งที่ต้องการได้ ไพ่ใบนี้ยืนยันว่าคุณมีศักยภาพและสติปัญญาเพียงพอที่จะจัดการกับสถานการณ์ตรงหน้าได้อย่างยอดเยี่ยม", adv: "นี่คือเวลาลงมือทำอย่างจริงจัง ดึงพรสวรรค์และความสามารถทั้งหมดที่มีออกมาใช้ให้เต็มที่ อย่ามัวแต่รอโอกาส เพราะคุณสร้างมันเองได้", r_kw: "ความลังเล, การหลอกลวง, พรสวรรค์ที่สูญเปล่า", r_gen: "คุณกำลังปล่อยให้โอกาสหลุดมือไปเพราะความไม่มั่นใจ หรือในอีกมุมหนึ่ง อาจมีใครบางคนกำลังใช้เล่ห์เหลี่ยมเอาเปรียบคุณอยู่ ข้อมูลที่คุณมียังไม่ครบถ้วน", r_adv: "อย่าประเมินค่าตัวเองต่ำไป และในขณะเดียวกันให้ระมัดระวังการตัดสินใจที่รวดเร็วเกินไป ตรวจสอบคนรอบข้างให้ดี" },
                en: { kw: "Potential, Manifestation, Skill, Creative Power", gen: "You have all the resources, knowledge, and connections at your fingertips. Like a magician, you can manifest your desires. This card confirms you have the capability and intellect to handle the current situation brilliantly.", adv: "It's time to take serious action. Utilize all your talents and skills to the fullest. Don't wait for an opportunity; create one.", r_kw: "Hesitation, Illusion, Wasted Talent", r_gen: "You are letting opportunities slip away due to self-doubt. Alternatively, someone might be manipulating or deceiving you. You don't have all the facts.", r_adv: "Do not underestimate yourself. At the same time, beware of making hasty decisions. Double-check the intentions of those around you." }

            "The High Priestess": { type: "major",

                en: { kw: "Intuition, Mystery, Silence, Subconscious", gen: "This is not the time for outward action. There are hidden elements beneath the surface that you can only sense intuitively. Your inner voice is highly accurate right now. The answers come from your subconscious, not logic.", adv: "Step back and remain still. Listen to your heart and intuition over the opinions of others. Secrets will reveal themselves in due time.", r_kw: "Confusion, Repression, Self-Deception", r_gen: "You might be ignoring your intuition, trying to use logic to mask your true feelings. This is causing deep-seated confusion and inner turmoil.", r_adv: "Stop lying to yourself. Find some quiet time to reflect on what your subconscious truly desires." }

            "The Empress": { type: "major",

                en: { kw: "Abundance, Nurturing, Creativity, Love", gen: "The embodiment of motherhood and abundance. What you have been nurturing is about to bear fruit. This is a period of receiving love, comfort, and deep emotional fulfillment. The energy around you is highly supportive and positive.", adv: "Take good care of yourself and your loved ones. Approach problems with gentleness. Allow things to grow and blossom naturally.", r_kw: "Self-Neglect, Over-dependence, Imbalance", r_gen: "You may be pouring too much into others while neglecting your own mental health. Or, you might be feeling creatively barren, uninspired, and emotionally insecure.", r_adv: "Direct your love and care back toward yourself. Set clear boundaries so your kindness isn't taken for granted." }

            "The Emperor": { type: "major",

                en: { kw: "Authority, Stability, Discipline, Leadership", gen: "Rules, structure, and leadership are paramount right now. The situation demands decisiveness and systematic management. You can bring everything under control through strength and clear principles.", adv: "Let logic rule over emotion. Plan your life and goals systematically, and you will firmly hold the reins of this situation.", r_kw: "Tyranny, Rigidity, Lack of Discipline", r_gen: "There may be an abuse of power or intense stress from trying to control every little detail. Conversely, it could mean you are neglecting your responsibilities, leading to chaos.", r_adv: "Lower your ego and soften your approach. Learn to be flexible and listen more to the perspectives of others." }
            },
            "The Hierophant": { type: "major",
                th: { kw: "แบบแผน, ประเพณี, การเรียนรู้, ผู้ชี้แนะ", gen: "ไพ่ใบนี้สื่อถึงการทำตามแบบแผนที่สังคมยอมรับ การปฏิบัติตามกฎ หรือการเข้าหาผู้มีความรู้และประสบการณ์เพื่อขอคำแนะนำ เป็นช่วงเวลาที่ความถูกต้องตามธรรมเนียมคือทางออกที่ปลอดภัยที่สุด", adv: "หากมีปัญหา ลองปรึกษาผู้ใหญ่หรือผู้เชี่ยวชาญ การเดินตามรอยเท้าของคนที่เคยสำเร็จมาก่อน หรือยึดมั่นในศีลธรรม จะช่วยให้คุณรอดพ้นอุปสรรค", r_kw: "การขบถ, การท้าทายกฎเกณฑ์, การคิดนอกกรอบ", r_gen: "คุณกำลังรู้สึกอึดอัดกับกฎเกณฑ์เดิมๆ หรือระบบที่ล้าหลัง อยากจะแหกคอกและทำตามวิธีของตัวเองเพื่อค้นหาความเป็นอิสระและแนวทางใหม่", r_adv: "บางครั้งการคิดนอกกรอบก็เป็นเรื่องดี ลองหาแนวทางใหม่ๆ ที่เหมาะกับตัวคุณเองดู แต่อย่าเพิ่งหักดิบจนสร้างศัตรูโดยไม่จำเป็น" },
                en: { kw: "Tradition, Conformity, Education, Mentor", gen: "This card points to following socially accepted structures, adhering to the rules, or seeking guidance from an experienced mentor. It's a time when traditional, tried-and-true methods are the safest bet.", adv: "If facing an issue, consult an elder or expert. Following in the footsteps of those who have succeeded, or clinging to your morals, will guide you safely.", r_kw: "Rebellion, Challenging Rules, Unconventionality", r_gen: "You are feeling suffocated by outdated rules or traditional systems. You want to break free and forge your own path to find independence.", r_adv: "Thinking outside the box can be highly beneficial. Explore new approaches that suit you, but avoid burning bridges unnecessarily in your rebellion." }
            },
            "The Lovers": { type: "major",
                th: { kw: "ความรัก, ทางเลือก, ความสัมพันธ์, ความกลมเกลียว", gen: "ไม่เพียงแต่สื่อถึงความรักที่ลึกซึ้งและการเข้ากันได้ดีเยี่ยม แต่ไพ่ใบนี้ยังหมายถึงช่วงเวลาที่คุณต้องเผชิญกับ 'ทางแยก' หรือการตัดสินใจครั้งสำคัญที่ต้องใช้ความซื่อสัตย์ต่อความรู้สึกของตนเองเป็นที่ตั้ง", adv: "เลือกทำในสิ่งที่คุณรักและตรงกับค่านิยมของตัวเองที่สุด ไม่ว่าจะเลือกทางไหน ขอให้เป็นการตัดสินใจที่มาจากก้นบึ้งของหัวใจจริงๆ", r_kw: "ความขัดแย้ง, ความลังเลใจ, ทางเลือกที่เจ็บปวด", r_gen: "ความสัมพันธ์อาจมีความขัดแย้ง ไม่ลงรอยกัน หรือตัวคุณเองกำลังเผชิญกับความลังเลอย่างหนัก เลือกไม่ถูกระหว่างสิ่งที่ถูกต้องกับสิ่งที่ถูกใจ", r_adv: "ทบทวนตัวเองและเคลียร์ใจให้ชัดเจนก่อนตัดสินใจ อย่าปล่อยให้ความต้องการชั่วคราวมาทำลายสิ่งที่มีค่าในระยะยาว" },
                en: { kw: "Love, Choices, Relationships, Harmony", gen: "Beyond indicating deep romantic connections and perfect harmony, this card signifies a major crossroads. You face a significant choice that requires absolute honesty regarding your true feelings.", adv: "Choose what you truly love and what aligns with your core values. Whichever path you take, ensure the decision comes from the bottom of your heart.", r_kw: "Conflict, Indecision, Painful Choices", r_gen: "A relationship may be experiencing friction or disharmony. Alternatively, you are paralyzed by indecision, torn between what is right and what is tempting.", r_adv: "Reflect and clear your mind before deciding. Don't let a temporary desire destroy something of long-term value." }
            },
            "The Chariot": { type: "major",
                th: { kw: "ความมุ่งมั่น, การควบคุมทิศทาง, ชัยชนะเหนืออุปสรรค", gen: "ไพ่แห่งนักรบที่ควบรถม้าออกศึก บ่งบอกว่าความสำเร็จอยู่ไม่ไกล แต่ต้องแลกมาด้วยความมุ่งมั่น การประคองสติ และการฝ่าฟันอุปสรรคอย่างไม่ยอมแพ้ คุณมีพลังที่จะขับเคลื่อนทุกอย่างไปข้างหน้า", adv: "อย่าเพิ่งถอดใจ เดินหน้าพุ่งชนเป้าหมายต่อไป จับพวงมาลัยชีวิตของตัวเองให้มั่น แล้วคุณจะสามารถเอาชนะอุปสรรคนี้ได้อย่างแน่นอน", r_kw: "การสูญเสียการควบคุม, หมดไฟ, อุปสรรคขวางกั้น", r_gen: "คุณกำลังรู้สึกเหมือนรถม้าหลุดโค้ง สถานการณ์ไม่อยู่ในความควบคุม เจอทางตัน หรือกำลังพยายามฝืนทำสิ่งที่ไม่เป็นผลจนเหนื่อยล้าไปเอง", r_adv: "ถอยกลับมาตั้งหลักก่อน อย่าฝืนดันรังถ้าสถานการณ์ยังไม่เป็นใจ หาจุดที่ผิดพลาด วางแผนใหม่ แล้วค่อยออกสตาร์ทอีกครั้ง" },
                en: { kw: "Determination, Control, Victory over Obstacles", gen: "The warrior driving the chariot signifies that success is within reach, but it demands fierce determination, focus, and relentlessly pushing through obstacles. You have the drive to propel things forward.", adv: "Do not give up. Keep charging toward your goal. Take a firm grip on the steering wheel of your life, and you will overcome these hurdles.", r_kw: "Loss of Control, Burnout, Blockages", r_gen: "You feel like a chariot veering off course. The situation is out of your hands, you've hit a wall, or you're exhausting yourself pushing against an unyielding force.", r_adv: "Fall back and regroup. Don't force the issue if the timing is wrong. Find the flaw in your plan, adjust, and start again." }
            },
            "Strength": { type: "major",
                th: { kw: "ความเข้มแข็ง, ความเมตตา, ความอดทน, การสยบปัญหา", gen: "ความแข็งแกร่งที่แท้จริงไม่ได้มาจากพละกำลัง แต่มาจากความเมตตา ความอดทน และความสงบในจิตใจ คุณมีพลังใจที่เหนือกว่าอุปสรรค และสามารถสยบปัญหาใหญ่ๆ หรือคนร้ายๆ ได้ด้วยความนุ่มนวล", adv: "ใช้ความใจเย็นและความอ่อนโยนในการแก้ปัญหา อดทนเข้าไว้ พลังใจที่เข้มแข็งและทัศนคติที่ดีจะนำพาคุณข้ามผ่านทุกเรื่องราว", r_kw: "ความอ่อนแอ, ความสงสัยในตัวเอง, การยอมแพ้", r_gen: "คุณกำลังรู้สึกหมดพลังกายและพลังใจ ขาดความเชื่อมั่นในตัวเอง และรู้สึกว่าปัญหาตรงหน้ามันหนักหนาเกินกว่าที่ตัวคุณจะรับไหว", r_adv: "ให้เวลาตัวเองได้พักผ่อนและฟื้นฟูจิตใจ อย่าเพิ่งกดดันตัวเองมากเกินไป ความเข้มแข็งจะกลับมาเมื่อสภาพจิตใจคุณพร้อม" },
                en: { kw: "Inner Strength, Compassion, Patience, Taming", gen: "True strength comes not from brute force, but from compassion, patience, and inner peace. You have the spiritual fortitude to overcome obstacles and tame volatile situations (or people) with a gentle touch.", adv: "Apply calmness and gentleness to solve your problems. Be patient. Your resilient spirit and positive attitude will see you through anything.", r_kw: "Weakness, Self-Doubt, Surrender", r_gen: "You are feeling physically and emotionally drained. Lacking self-confidence, the problems in front of you seem insurmountable.", r_adv: "Give yourself permission to rest and recover. Stop putting so much pressure on yourself. Your strength will return when your mind is healed." }
            },
            "The Hermit": { type: "major",
                th: { kw: "การค้นหาตัวเอง, การปลีกวิเวก, ปัญญา, การทบทวน", gen: "ช่วงเวลาที่แสงไฟภายนอกดับลง เพื่อให้แสงสว่างภายในจิตใจทำงาน ถึงเวลาต้องถอยห่างจากความวุ่นวายของสังคม เพื่อค้นหาความจริงและคำตอบจากตัวตนส่วนลึก เป็นไพ่ของการเติบโตทางจิตวิญญาณ", adv: "ลองใช้เวลาอยู่กับตัวเองเงียบๆ ลดการเข้าสังคมลงชั่วคราว แล้วคุณจะได้ตกตะกอนความคิดและมองเห็นหนทางที่ชัดเจนและถูกต้องยิ่งขึ้น", r_kw: "ความโดดเดี่ยว, การปิดกั้นตัวเอง, การหลงทาง", r_gen: "คุณอาจกำลังแยกตัวออกจากโลกภายนอกมากเกินไปจนกลายเป็นความเหงาและโดดเดี่ยว หรือกำลังจมอยู่กับความคิดวนเวียนจนหาทางออกให้ชีวิตไม่ได้", r_adv: "การอยู่คนเดียวไม่ได้ช่วยแก้ปัญหาเสมอไป เปิดใจรับความช่วยเหลือจากคนอื่นบ้าง การออกไปเจอโลกภายนอกจะทำให้คุณได้มุมมองใหม่ๆ" },
                en: { kw: "Soul-Searching, Solitude, Wisdom, Reflection", gen: "A time when the external lights dim so your inner light can guide you. It's time to step away from societal noise to seek truth and answers from deep within. A period of profound spiritual growth.", adv: "Spend time in quiet solitude. Temporarily reduce social engagements. You will process your thoughts and find a much clearer, truer path.", r_kw: "Isolation, Withdrawal, Being Lost", r_gen: "You might be isolating yourself from the world to the point of severe loneliness. Alternatively, you are stuck in your own head, unable to find a way forward.", r_adv: "Being alone isn't always the cure. Open your heart to help from others. Stepping outside will grant you a much-needed fresh perspective." }
            },
            "Wheel of Fortune": { type: "major",
                th: { kw: "โชคชะตา, จุดเปลี่ยน, วัฏจักร, โอกาสใหม่", gen: "กงล้อแห่งโชคชะตากำลังหมุน วัฏจักรของชีวิตกำลังจะนำพาจุดเปลี่ยนสำคัญ โอกาสดีๆ หรือเหตุการณ์ที่อยู่นอกเหนือการคาดเดามาให้ ทุกอย่างกำลังเคลื่อนตัวไปในทิศทางที่เป็นบวกอย่างก้าวกระโดด", adv: "ยอมรับการเปลี่ยนแปลงและเตรียมตัวคว้าโอกาสที่กำลังจะหมุนมาถึง ปล่อยให้ชีวิตไหลไปตามจังหวะของมัน อะไรจะเกิดก็ต้องเกิด", r_kw: "โชคร้าย, เหตุการณ์พลิกผัน, ความสูญเสียการควบคุม", r_gen: "กงล้อหมุนไปในทางที่ไม่ค่อยเป็นใจ คุณอาจเจอกับสถานการณ์ที่อยู่เหนือการควบคุม ความล่าช้า หรือเรื่องโชคร้ายที่เข้ามาแบบไม่ทันตั้งตัว", r_adv: "อย่าฝืนต้านกระแส หรือมัวแต่โทษโชคชะตา เตรียมรับมืออย่างมีสติและอดทนรอให้พายุลูกนี้ผ่านพ้นไป ทุกอย่างมีขึ้นมีลง" },
                en: { kw: "Destiny, Turning Point, Cycles, New Opportunities", gen: "The wheel of fortune is turning. Life's cycles are bringing a major turning point, lucky breaks, or unpredictable events. Things are rapidly shifting into a highly positive trajectory.", adv: "Accept the coming changes and be ready to seize the opportunities spinning your way. Let life flow to its own rhythm. What will be, will be.", r_kw: "Bad Luck, Reversals, Loss of Control", r_gen: "The wheel turns unfavorably. You may face situations entirely out of your control, frustrating delays, or unexpected misfortune.", r_adv: "Do not fight the current or blame fate. Handle things mindfully and wait patiently for this storm to pass. What goes down must come up." }
            },
            "Justice": { type: "major",
                th: { kw: "ความยุติธรรม, ความสมดุล, เหตุผล, ผลของการกระทำ", gen: "ตราชั่งแห่งความยุติธรรมกำลังทำงาน ทุกสิ่งจะถูกประเมินตามความเป็นจริง ทำสิ่งใดไว้ก็จะได้รับผลลัพธ์ที่คู่ควร สถานการณ์จะคลี่คลายอย่างเป็นธรรมและโปร่งใส ไม่มีการเข้าข้างฝ่ายใดฝ่ายหนึ่ง", adv: "ใช้ความเป็นกลางและเหตุผลขั้นสูงสุดในการตัดสินปัญหา ซื่อสัตย์ต่อตนเองและผู้อื่น แล้วผลลัพธ์จะออกมาดีงามอย่างที่คุณควรได้รับ", r_kw: "ความอยุติธรรม, อคติ, การถูกเอาเปรียบ, การหลอกลวง", r_gen: "อาจมีความไม่โปร่งใส การเอาเปรียบ หรือสถานการณ์ที่คุณรู้สึกว่าไม่ได้รับความเป็นธรรม มีการตัดสินใจที่ใช้อารมณ์หรืออคติส่วนตัวเข้ามาแทรกแซง", r_adv: "ตรวจสอบข้อเท็จจริง เอกสาร และคำสัญญาให้ละเอียดถี่ถ้วน ระมัดระวังการถูกเอาเปรียบ และพยายามรักษาจุดยืนที่ถูกต้องของคุณไว้" },
                en: { kw: "Justice, Balance, Logic, Karma/Consequence", gen: "The scales of justice are at work. Everything will be evaluated truthfully. You will reap exactly what you have sown. The situation will resolve fairly, transparently, and without bias.", adv: "Apply strict objectivity and logic to solve your problems. Be honest with yourself and others, and the outcome will be as just as you deserve.", r_kw: "Injustice, Bias, Being Exploited, Deceit", r_gen: "There may be a lack of transparency, exploitation, or a situation where you feel deeply wronged. Decisions are being clouded by emotion or personal bias.", r_adv: "Thoroughly review facts, documents, and promises. Guard yourself against being taken advantage of, and firmly maintain your moral high ground." }
            },
            "The Hanged Man": { type: "major",
                th: { kw: "การรอคอย, การเสียสละ, การเปลี่ยนมุมมอง, ความชะงักงัน", gen: "สถานการณ์กำลังหยุดนิ่ง คุณไม่สามารถฝืนดึงดันอะไรได้ในตอนนี้ เป็นช่วงเวลาที่ต้องยอม 'แขวน' ตัวเองไว้ เสียสละความต้องการบางอย่าง หรือยอมถอยหลังหนึ่งก้าว เพื่อให้ได้มาซึ่งมุมมองหรือปัญญาใหม่ๆ ที่ลึกซึ้งกว่าเดิม", adv: "ปล่อยวางการควบคุม และยอมรับความจริงที่ว่าบางอย่างต้องใช้เวลา ลองมองปัญหาจากมุมมองที่กลับหัวกลับหางดู แล้วคุณจะเห็นทางสว่าง", r_kw: "การดันทุรัง, การเสียสละที่สูญเปล่า, การหลอกตัวเอง", r_gen: "คุณกำลังดื้อรั้นพยายามผลักดันสถานการณ์ที่ไม่เป็นใจ หรือลงทุนลงแรงไปกับการเสียสละที่ไม่คุ้มค่า ขาดความยืดหยุ่นและไม่ยอมรับความจริง", r_adv: "เลิกเอาชนะในเกมที่คุณเสียเปรียบ การดันทุรังมีแต่จะทำให้เจ็บตัว ยอมรับความจริงแล้วมองหาเส้นทางอื่นจะดีกว่า" },
                en: { kw: "Waiting, Sacrifice, New Perspectives, Stagnation", gen: "The situation has ground to a halt. You cannot force progress right now. It is a time to 'suspend' yourself, sacrifice immediate desires, or take a step back in order to gain a profound new understanding.", adv: "Relinquish control and accept that some things just take time. Try looking at the problem completely upside down; enlightenment will follow.", r_kw: "Stubbornness, Pointless Sacrifice, Self-Deception", r_gen: "You are stubbornly pushing against unyielding circumstances, or making sacrifices that yield no reward. You are inflexible and refusing to face facts.", r_adv: "Stop trying to win a game stacked against you. Forcing it will only cause pain. Accept reality and look for an entirely different route." }
            },
            "Death": { type: "major",
                th: { kw: "การสิ้นสุด, การเปลี่ยนผ่าน, การเกิดใหม่, การตัดทิ้ง", gen: "ไพ่ใบนี้ไม่ได้แปลว่าความตายทางกายภาพ แต่คือ 'การสิ้นสุดของวัฏจักรเก่า' เพื่อเปิดทางให้สิ่งใหม่ที่ดีกว่าเข้ามา เป็นการเปลี่ยนแปลงครั้งใหญ่ที่คุณต้องกล้าที่จะทิ้งสิ่งเดิมๆ ไว้เบื้องหลัง เพื่อชุบชีวิตใหม่ให้กับตัวเอง", adv: "ปล่อยวางอดีต ความสัมพันธ์ หรือนิสัยที่คอยฉุดรั้งคุณไว้ อย่ากลัวการจบสิ้น เพราะเมื่อประตูบานหนึ่งปิดลง ประตูบานใหม่ที่สว่างกว่าจะเปิดออก", r_kw: "การยึดติด, การต่อต้านการเปลี่ยนแปลง, ความกลัวการสูญเสีย", r_gen: "คุณกำลังพยายามเหนี่ยวรั้งอดีตไว้ ยึดติดกับสิ่งที่จบไปแล้ว ทำให้ชีวิตไม่สามารถก้าวต่อไปข้างหน้าได้ เกิดเป็นความเจ็บปวดเรื้อรังที่บั่นทอนจิตใจ", r_adv: "ยอมรับความเปลี่ยนแปลงเถอะ การฝืนเก็บสิ่งที่ตายไปแล้วไว้ มีแต่จะทำให้จิตใจคุณเป็นพิษ ตัดใจแล้วมูฟออนเพื่อตัวคุณเอง" },
                en: { kw: "Endings, Transition, Rebirth, Severing", gen: "This card rarely means physical death; it signifies the 'death of an old cycle' to make way for something better. It represents a massive transformation requiring you to leave the past behind to resurrect your life.", adv: "Release the past, relationships, or habits holding you back. Do not fear the ending. When one door closes, a brighter one opens.", r_kw: "Clinging, Resisting Change, Fear of Loss", r_gen: "You are desperately holding onto the past. Clinging to what has already ended prevents you from moving forward, causing chronic emotional pain.", r_adv: "Accept the change. Keeping something that is already dead will only poison your spirit. Cut your losses and move on for your own sake." }
            },
            "Temperance": { type: "major",
                th: { kw: "ความสมดุล, การประนีประนอม, การเยียวยา, การผสมผสาน", gen: "เทวดากำลังเทน้ำสลับแก้วเพื่อหาอุณหภูมิที่พอดี นี่คือช่วงเวลาแห่งการปรับสมดุลชีวิต การประสานรอยร้าว และการผสมผสานความแตกต่างให้เข้ากันได้อย่างลงตัว สถานการณ์กำลังจะได้รับการเยียวยา", adv: "เดินทางสายกลาง ไม่ตึงและไม่หย่อนจนเกินไป ใช้ความใจเย็นและการประนีประนอมในการแก้ปัญหา แล้วทุกอย่างจะค่อยๆ ราบรื่น", r_kw: "ความขาดสมดุล, ความสุดโต่ง, ความขัดแย้ง, อารมณ์แปรปรวน", r_gen: "ชีวิตคุณกำลังเสียศูนย์ อาจทำงานหนักเกินไปจนป่วย หรือมีความขัดแย้งกับคนรอบข้างเพราะความเห็นที่ไม่ลงรอยกัน อารมณ์ของคุณกำลังสวิงอย่างรุนแรง", r_adv: "ดึงตัวเองกลับมาสู่จุดสมดุลโดยด่วน หาเวลาพักผ่อน และพยายามมองหาจุดกึ่งกลางในการแก้ปัญหาร่วมกับผู้อื่น ลดความสุดโต่งลง" },
                en: { kw: "Balance, Compromise, Healing, Blending", gen: "An angel pours water between cups to find the perfect temperature. This is a time of life-balancing, mending rifts, and seamlessly blending opposing forces. The situation is undergoing deep healing.", adv: "Walk the middle path—neither too strict nor too loose. Use patience and compromise to solve issues, and things will gradually smooth out.", r_kw: "Imbalance, Extremes, Conflict, Mood Swings", r_gen: "Your life is off-center. You might be working yourself to the bone or clashing with others over fundamental differences. Your emotions are highly volatile.", r_adv: "Pull yourself back to the center immediately. Rest, and actively seek a middle ground with others. Tone down the extremes." }
            },
            "The Devil": { type: "major",
                th: { kw: "พันธนาการ, กิเลส, การยึดติด, ความสัมพันธ์ที่เป็นพิษ", gen: "คุณกำลังถูกผูกมัดด้วยบางสิ่งบางอย่าง อาจเป็นนิสัยที่ไม่ดี กิเลสตัณหา ความกลัว หรือความสัมพันธ์แบบ Toxic ที่ดึงรั้งคุณไว้ โดยที่คุณถูกหลอกให้เชื่อว่าตัวเองหนีไปไหนไม่ได้ หรือขาดสิ่งนี้ไม่ได้", adv: "ตระหนักรู้ถึงสิ่งที่เป็นพิษในชีวิต โซ่ที่ล่ามคุณไว้ไม่ได้ล็อคกุญแจ คุณมีสิทธิ์และอิสระที่จะเดินออกมาได้เสมอ แค่ต้องใช้ความกล้าหาญที่จะเอาชนะใจตัวเอง", r_kw: "การหลุดพ้น, การตาสว่าง, อิสรภาพ, การเอาชนะใจตัวเอง", r_gen: "คุณเริ่มมองเห็นความจริงและทางสว่าง คุณกำลังจะสามารถสลัดตัวเองหลุดพ้นจากสิ่งเลวร้าย นิสัยแย่ๆ หรือความเชื่อที่ผิดๆ ได้สำเร็จแล้ว", r_adv: "รักษาความเข้มแข็งนี้ไว้ คุณมาถูกทางแล้ว อย่าปล่อยให้ตัวเองหันหลังกลับไปหาสิ่งที่เคยทำร้ายหรือกัดกินจิตใจคุณอีกเด็ดขาด" },
                en: { kw: "Bondage, Addiction, Attachment, Toxic Relationships", gen: "You are bound by something—bad habits, materialism, fear, or a toxic dynamic. You have been tricked into believing you cannot escape or cannot live without it.", adv: "Acknowledge the toxins in your life. The chains holding you are unlocked. You always have the freedom to walk away; you just need the courage to conquer your own mind.", r_kw: "Release, Awakening, Freedom, Overcoming Self", r_gen: "You are finally seeing the light and the truth. You are on the verge of successfully breaking free from toxic influences, bad habits, or false beliefs.", r_adv: "Maintain this fierce strength. You are exactly on the right path. Never let yourself return to the things that once consumed your soul." }
            },
            "The Tower": { type: "major",

                    en: {
                        kw: `${r} of ${s} (Minor Arcana)`,
                        gen: `This card represents the energy of **${ranks[r].en}**, directly impacting matters concerning **${suits[s].en}**. The current situation calls for you to face this context earnestly. Your actions will directly influence changes in this area.`,
                        adv: "Pay special attention to this issue. Handle it mindfully and carefully, and you will be able to control the outcome.",
                        r_kw: `Blockages / Delays (${r} of ${s})`,
                        r_gen: `Reversed, this card signifies delays, hidden problems, or difficulties arising from **${ranks[r].en}**, which are currently having a negative impact on your **${suits[s].en}**.`,
                        r_adv: "Don't rush or force things. Take a step back to identify the root cause of the problem before trying to fix it."
                    }
                };
            }
        }

        // ================== LOGIC ==================
        let userQuestionObj = null;
        let activeSpreadId = "";
        let selectedCards = [];
        let currentEditingSlot = null;

        function getImageUrl(name) { return `https://media.tidebell.com/tarot/${name.toLowerCase().replace(/ /g, '-')}.webp`; }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-th').classList.toggle('active-lang', lang === 'th');
            document.getElementById('btn-en').classList.toggle('active-lang', lang === 'en');
            
            document.getElementById('ui-phase1-title').innerText = uiText[lang].phase1Title;
            document.getElementById('ui-phase1-sub').innerText = currentLang === 'th' ? uiText.th.phase1Sub : uiText.en.phase1Sub;
            document.getElementById('ui-phase2-title').innerText = uiText[lang].phase2Title;
            document.getElementById('ui-deck-major').innerText = uiText[lang].deckMajor;
            document.getElementById('ui-deck-full').innerText = uiText[lang].deckFull;
            document.getElementById('ui-btn-back-q').innerText = uiText[lang].backQBtn;
            document.getElementById('ui-phase3-desc').innerText = uiText[lang].phase3Desc;
            document.getElementById('ui-btn-predict').innerText = uiText[lang].predictBtn;
            document.getElementById('ui-btn-back-spread').innerText = uiText[lang].backSpreadBtn;
            document.getElementById('ui-btn-restart').innerText = uiText[lang].restartBtn;
            document.getElementById('ui-modal-title').innerText = uiText[lang].modalTitle;

            renderQuestions();
            renderSpreadButtons();
            
            if(userQuestionObj) {
                document.getElementById('display-q-phase2').innerText = `${uiText[lang].questionPrefix} "${userQuestionObj[lang]}"`;
                document.getElementById('display-q-phase3').innerText = `${uiText[lang].questionPrefix} "${userQuestionObj[lang]}"`;
            }
            if(activeSpreadId) setupCardInputs(activeSpreadId, true);
            
            if(document.getElementById('phase-4').classList.contains('active')) {
                generateReading(false); 
            }
            playClick();
        }

        function renderQuestions() {
            let listDiv = document.getElementById('question-list');
            listDiv.innerHTML = '';
            allQuestions.forEach(qObj => {
                let btn = document.createElement('div');
                btn.className = 'q-item'; 
                btn.innerHTML = `<span>${qObj[currentLang]}</span>`;
                btn.onclick = () => {
                    playClick();
                    userQuestionObj = qObj;
                    document.getElementById('display-q-phase2').innerText = `${uiText[currentLang].questionPrefix} "${qObj[currentLang]}"`;
                    document.getElementById('display-q-phase3').innerText = `${uiText[currentLang].questionPrefix} "${qObj[currentLang]}"`;
                    changePhase('phase-1', 'phase-2');
                };
                listDiv.appendChild(btn);
            });
        }

        function renderSpreadButtons() {
            let container = document.getElementById('spread-buttons');
            container.innerHTML = '';
            Object.keys(spreadsConfig).forEach(id => {
                let config = spreadsConfig[id];
                let card = document.createElement('div');
                card.className = 'spread-card-menu';
                
                let miniHTML = '';
                if(id === 'spark') miniHTML = `<div class="mini-spark"><div class="mini-card">1</div></div>`;
                if(id === 'time') miniHTML = `<div class="mini-time"><div class="mini-card">1</div><div class="mini-card">2</div><div class="mini-card">3</div></div>`;
                if(id === 'insight') miniHTML = `<div class="mini-insight"><div class="mini-card c1">1</div><div class="mini-card c2">2</div><div class="mini-card c3">3</div></div>`;
                if(id === 'jigsaw') miniHTML = `<div class="mini-jigsaw"><div class="mini-card c4">4</div><div class="mini-card c1">1</div><div class="mini-card c2">2</div><div class="mini-card c3">3</div></div>`;
                if(id === 'crossroad') miniHTML = `<div class="mini-crossroad"><div class="mini-card c4">4</div><div class="mini-card c2">2</div><div class="mini-card c1">1</div><div class="mini-card c3">3</div><div class="mini-card c5">5</div></div>`;
                if(id === 'relation') miniHTML = `<div class="mini-relation"><div class="mini-card">1</div><div class="mini-card">3</div><div class="mini-card">5</div><div class="mini-card">2</div><div class="mini-card">4</div><div class="mini-card">6</div></div>`;

                card.innerHTML = `
                    <div class="spread-card-visual">${miniHTML}</div>
                    <div style="text-align: center;">
                        <div class="spread-card-title">${config.name[currentLang]}</div>
                        <div class="spread-card-subtitle">${config.count} ${currentLang==='th'?'ใบ':'Cards'}</div>
                    </div>
                `;
                card.onclick = () => { playClick(); setupCardInputs(id); }
                container.appendChild(card);
            });
        }

        function changePhase(hideId, showId) {
            if(hideId !== 'phase-1') playClick();
            document.getElementById(hideId).classList.remove('active');
            document.getElementById(showId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function setupCardInputs(spreadId, isRefresh = false) {
            activeSpreadId = spreadId;
            let config = spreadsConfig[spreadId];
            if(!isRefresh) selectedCards = Array(config.count).fill(null);
            
            document.getElementById('display-spread').innerText = `${uiText[currentLang].spreadPrefix} ${config.name[currentLang]}`;
            
            let container = document.getElementById('card-slots-container');
            container.innerHTML = ''; container.className = `reading-area ${config.layoutClass}`; 
            
            for (let i = 0; i < config.count; i++) {
                let posText = config.labels[currentLang][i];
                let slot = document.createElement('div');
                slot.className = 'card-slot'; slot.id = `slot-${i}`;
                
                let cardHTML = `<div class="card-badge">${i+1}</div>`;
                
                if (selectedCards[i]) {
                    let card = selectedCards[i];
                    let btnText = card.status === 'upright' ? uiText[currentLang].btnUpright : uiText[currentLang].btnReversed;
                    let revClass = card.status === 'upright' ? '' : 'is-reversed';
                    slot.className += ` has-card ${revClass}`;
                    
                    cardHTML += `
                        <img class="card-image-preview" id="img-slot-${i}" src="${getImageUrl(card.name)}" style="display:block;" onerror="this.src='https://media.tidebell.com/tarot/card-back.webp'">
                        <div class="card-label" id="label-slot-${i}"><b>${card.name}</b><br><span style="font-size:10px;">${posText}</span></div>
                        <button class="card-status-btn" id="status-btn-${i}" style="display:inline-block;" onclick="toggleStatus(event, ${i})">${btnText}</button>
                    `;
                } else {
                    cardHTML += `
                        <img class="card-image-preview" id="img-slot-${i}" src="">
                        <div class="card-label" id="label-slot-${i}">${uiText[currentLang].clickToSelect}<br>(${posText})</div>
                        <button class="card-status-btn" id="status-btn-${i}" onclick="toggleStatus(event, ${i})">${uiText[currentLang].btnUpright}</button>
                    `;
                }
                
                slot.innerHTML = cardHTML;
                slot.onclick = () => { playClick(); openModal(i); }
                container.appendChild(slot);
            }
            if(!isRefresh) changePhase('phase-2', 'phase-3');
        }

        function openModal(slotIndex) {
            currentEditingSlot = slotIndex;
            let grid = document.getElementById('modal-card-grid');
            grid.innerHTML = ''; 
            let isFullDeck = document.getElementById('full-deck-toggle').checked;

            Object.keys(tarotDB).forEach(name => {
                if (!isFullDeck && tarotDB[name].type === 'minor') return; 
                let div = document.createElement('div');
                div.className = 'modal-card';
                div.innerHTML = `<img src="${getImageUrl(name)}" onerror="this.src='https://media.tidebell.com/tarot/card-back.webp'"><span>${name}</span>`;
                div.onclick = () => pickCard(name);
                grid.appendChild(div);
            });
            document.getElementById('card-modal').style.display = 'block';
        }

        function closeModal() { document.getElementById('card-modal').style.display = 'none'; }

        function pickCard(name) {
            playChime();
            selectedCards[currentEditingSlot] = { name: name, status: 'upright' };
            setupCardInputs(activeSpreadId, true); 
            closeModal();
        }

        function toggleStatus(event, index) {
            event.stopPropagation();
            playClick();
            if (!selectedCards[index]) return;
            selectedCards[index].status = selectedCards[index].status === 'upright' ? 'reversed' : 'upright';
            setupCardInputs(activeSpreadId, true); 
        }

        function getOverallReadingHTML() {
            let majors = 0, wands = 0, cups = 0, swords = 0, pentacles = 0;
            let upright = 0, reversed = 0;

            selectedCards.forEach(c => {
                if(c.status === 'upright') upright++; else reversed++;
                let db = tarotDB[c.name];
                if(db.type === 'major') majors++;
                else {
                    if(c.name.includes("Wands")) wands++;
                    if(c.name.includes("Cups")) cups++;
                    if(c.name.includes("Swords")) swords++;
                    if(c.name.includes("Pentacles")) pentacles++;
                }
            });

            let dominant = "balanced_neu";
            let max = Math.max(majors, wands, cups, swords, pentacles);
            
            if(selectedCards.length > 1 && max > 1) {
                if(max === majors) dominant = "majors";
                else if(max === wands) dominant = "wands";
                else if(max === cups) dominant = "cups";
                else if(max === swords) dominant = "swords";
                else if(max === pentacles) dominant = "pentacles";
            } else if (selectedCards.length > 1) {
                if(upright > reversed) dominant = "balanced_pos";
                else if(reversed > upright) dominant = "balanced_neg";
            }

            let vibeText = overallVibeTexts[currentLang][dominant];
            
            let rootCard = selectedCards[0];
            let finalCard = selectedCards[selectedCards.length - 1];
            let rootMeaning = rootCard.status === 'upright' ? tarotDB[rootCard.name][currentLang].gen : tarotDB[rootCard.name][currentLang].r_gen;
            let finalAdvice = finalCard.status === 'upright' ? tarotDB[finalCard.name][currentLang].adv : tarotDB[finalCard.name][currentLang].r_adv;

            return `
                <div class="summary-dashboard">
                    <div class="summary-title">${uiText[currentLang].sumTitle}</div>
                    <div class="question-highlight">
                        <strong>${uiText[currentLang].questionPrefix}</strong> "${userQuestionObj[currentLang]}"
                    </div>
                    
                    <div class="overall-reading-box">
                        <div class="summary-text" style="color: var(--accent); font-weight: 500; font-size: 18px;">
                            ${uiText[currentLang].sumIntro}
                        </div>
                        <div class="summary-text">
                            ${vibeText}
                        </div>
                        <div class="summary-text" style="margin-top: 20px;">
                            ${currentLang === 'th' ? 'เรื่องราวทั้งหมดนี้มีจุดเริ่มต้นหรือรากฐานมาจากพลังงานของไพ่' : 'This entire narrative is rooted in the energy of'} <strong>${rootCard.name}</strong> ${currentLang === 'th' ? 'ซึ่งตีความได้ว่า' : 'which suggests that'} <br><br><em>"${rootMeaning}"</em>
                        </div>
                    </div>

                    <div class="summary-text" style="margin-top: 30px; text-align: center; color: #00f2fe; font-size: 18px;">
                        ${currentLang === 'th' ? 'และเพื่อนำทางคุณไปสู่ผลลัพธ์ที่ดีที่สุด ไพ่บทสรุป (<strong>'+finalCard.name+'</strong>) ได้ฝากคำแนะนำสำคัญไว้ว่า:' : 'To guide you toward the best outcome, the final card (<strong>'+finalCard.name+'</strong>) leaves you with this crucial advice:'}
                    </div>
                    
                    <div class="final-advice-box">
                        " ${finalAdvice} "
                    </div>
                </div>
            `;
        }

        function generateReading(scrollToTop = true) {
            playChime();
            if (selectedCards.includes(null)) { alert(uiText[currentLang].alertSelectAll); return; }

            let config = spreadsConfig[activeSpreadId];
            let resultBox = document.getElementById('result-box');
            
            let finalHTML = getOverallReadingHTML();

            finalHTML += `<h3 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 50px; color: var(--accent); font-size: 24px;">${uiText[currentLang].detailTitle}</h3>`;
            
            selectedCards.forEach((card, index) => {
                let posText = config.labels[currentLang][index];
                let isUp = (card.status === 'upright');
                let data = tarotDB[card.name][currentLang];
                let kw = isUp ? data.kw : data.r_kw;
                let gen = isUp ? data.gen : data.r_gen;
                let adv = isUp ? data.adv : data.r_adv;
                let imgClass = isUp ? "reading-img" : "reading-img reversed";
                let statusText = isUp ? "" : (currentLang === 'th' ? "(กลับหัว)" : "(Reversed)");

                finalHTML += `
                    <div class="reading-section">
                        <img src="${getImageUrl(card.name)}" class="${imgClass}" onerror="this.src='https://media.tidebell.com/tarot/card-back.webp'">
                        <div style="flex: 1;">
                            <div class="card-title">[${index+1}. ${posText}] <br><span style="color:#fff; font-size:18px;">${card.name} ${statusText}</span></div>
                            <div class="card-keywords">${uiText[currentLang].keywordLabel} ${kw}</div>
                            <div class="card-desc"><strong>${uiText[currentLang].meaningLabel}</strong> ${gen}</div>
                            <div class="card-advice">✨ <strong>${uiText[currentLang].adviceLabel}</strong> ${adv}</div>
                        </div>
                    </div>
                `;
            });

            resultBox.innerHTML = finalHTML;
            
            if(!document.getElementById('phase-4').classList.contains('active')) {
                changePhase('phase-3', 'phase-4');
            }
            
            resultBox.style.display = 'block';
            if(scrollToTop) window.scrollTo(0, 0);
        }

        // Initialize
        setLang('th');
    </script>
</body>
</html>
